<section class="panel">
  <app-section-header
    [icone]="icone"
    titulo="Histórico de Medicamentos"
    subtitulo="Em “Término”, escreva a data ou “Em uso” para tratamentos contínuos."
  />
  <app-editable-table
    [colunas]="colunas"
    [linhas]="linhas()"
    rotuloAdicionar="Adicionar medicamento"
    (adicionar)="adicionar()"
    (remover)="remover($event)"
    (alterar)="alterar($event)"
  />
</section>
